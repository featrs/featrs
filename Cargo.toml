[package]
name = "featrs"
version = "0.6.8"
edition = "2024"
rust-version = "1.91"
description = "Feature engineering library for Rust, inspired by scikit-learn"
authors = ["Aditya Vikram Mahendru"]
license = "MIT"
repository = "https://github.com/featrs/featrs"
documentation = "https://docs.rs/featrs"
keywords = ["feature-engineering", "machine-learning", "preprocessing", "scikit-learn"]
categories = ["science", "data-structures"]

[dependencies]
polars = "0.54"
regex = "1"
statrs = "0.19"
thiserror = "2"

[features]
# LazyFrame support. Needs Rust 1.95+, because the Polars lazy engine
# compiles `polars-stream`, which uses `Atomic*::try_update`.
lazy = ["polars/lazy", "polars/strings", "polars/log"]

[dev-dependencies]
approx = "0.5"
criterion = "0.8"

[lib]
name = "featrs"
path = "src/lib.rs"
# Keep libtest out of `cargo bench`, so Criterion flags such as
# `--save-baseline` reach the suites instead of failing in libtest.
bench = false

[[test]]
name = "lazyframe_integration"
required-features = ["lazy"]

[[bench]]
name = "encoder"
harness = false

[[bench]]
name = "feature_hasher"
harness = false

[[bench]]
name = "kernel_compare"
harness = false

[[bench]]
name = "normalizer"
harness = false

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "polynomial"
harness = false

[[bench]]
name = "scalers"
harness = false

[[bench]]
name = "time_series"
harness = false
