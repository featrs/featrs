# release-plz opens a release PR on every push to main. Merging that PR is what
# publishes to crates.io, pushes the tag, and creates the GitHub release.
[workspace]
# Only release after a release PR is merged, not on every main commit.
release_always = false
# This crate is pre-1.0 and has historically used minor bumps for new features.
features_always_increment_minor = true
# Report API breakage in the release PR via cargo-semver-checks.
semver_check = true
publish_timeout = "10m"

[changelog]
# Match the sections already used in CHANGELOG.md and keep docs/chore commits
# out of the release notes.
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Changed" },
  { message = "^refactor", group = "Changed" },
  { message = "^revert", group = "Changed" },
  { message = "^docs", skip = true },
  { message = "^test", skip = true },
  { message = "^chore", skip = true },
  { message = "^ci", skip = true },
  { message = "^style", skip = true },
]
protect_breaking_commits = true
