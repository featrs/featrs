name: Release crate

on:
  workflow_call:
    inputs:
      tag:
        description: Tag to publish, for example v0.6.0
        required: true
        type: string
      version:
        description: Version without the v prefix, for example 0.6.0
        required: true
        type: string
      nightly:
        description: Whether this is an automated nightly snapshot
        required: false
        type: boolean
        default: false
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: true

permissions:
  contents: write

jobs:
  publish:
    name: Publish ${{ inputs.tag }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Verify tag matches Cargo.toml
        run: |
          set -euo pipefail
          manifest_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$manifest_version" != "${{ inputs.version }}" ]; then
            echo "Tag is ${{ inputs.version }} but Cargo.toml is $manifest_version" >&2
            exit 1
          fi

      - name: Run tests
        run: cargo test --all-features

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'User-Agent: featrs-release-workflow (https://github.com/featrs/featrs)' \
            "https://crates.io/api/v1/crates/featrs/${{ inputs.version }}")
          if [ "$status" = "200" ]; then
            echo "featrs ${{ inputs.version }} is already on crates.io; skipping publish."
          else
            cargo publish
          fi

      - name: Build release notes
        run: |
          set -euo pipefail
          mkdir -p target/release-notes
          if [ "${{ inputs.nightly }}" = "true" ]; then
            cat > target/release-notes/body.md <<'EOF'
          Automated nightly snapshot of `main`.

          This is a regular crates.io release, but it may be less stable than a
          milestone release.
          EOF
          else
            awk -v ver="${{ inputs.version }}" '
              $0 ~ "^## \\[" ver "\\]" { flag=1; next }
              flag && /^## \[/ { exit }
              flag
            ' CHANGELOG.md > target/release-notes/body.md
            if [ ! -s target/release-notes/body.md ]; then
              echo "No CHANGELOG.md entry found for ${{ inputs.version }}" >&2
              exit 1
            fi
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.nightly && format('{0} (nightly)', inputs.tag) || inputs.tag }}
          body_path: target/release-notes/body.md
          prerelease: ${{ inputs.nightly }}
          make_latest: ${{ !inputs.nightly }}
          generate_release_notes: ${{ inputs.nightly }}
